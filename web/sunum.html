<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0908">
<title>Chronosphere — Sinematik Sunum & Hikâye Modu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0908'/%3E%3Ccircle cx='13' cy='17' r='7' fill='none' stroke='%23f3eee6' stroke-width='2'/%3E%3Ccircle cx='19' cy='14' r='7' fill='%23ff7b39'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/fonts.css">
<style>
:root {
  --bg: #070605;
  --surface: #13110f;
  --surface-2: #1d1916;
  --line: #2f2a25;
  --line-2: #483f36;
  --ink: #f3eee6;
  --ink-2: #b8afa2;
  --ink-3: #877e72;
  --ember: #ff7b39;
  --ember-ink: #1b0b02;
  --mint: #5fe0b0;
  --gold: #f2c14e;
  --cyan: #4cc9f0;
  --rose: #ff5d8f;
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); -webkit-font-smoothing: antialiased;
  user-select: none;
}
#stagewrap {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 42%, #15110d 0%, #070605 75%);
}
canvas#cinema {
  display: block;
  width: 100vw; height: 100vh;
  cursor: pointer;
}

/* Top Floating Bar */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px;
  background: linear-gradient(180deg, rgba(7,6,5,0.88) 0%, rgba(7,6,5,0.45) 70%, transparent 100%);
  transition: opacity 0.35s ease, transform 0.35s ease;
}
body.idle .topbar, body.idle .bottomhud {
  opacity: 0; pointer-events: none;
}
.brand {
  display: flex; align-items: center; gap: 11px;
  text-decoration: none; color: var(--ink);
}
.brand span {
  font: italic 26px/1 var(--serif); letter-spacing: 0.3px;
}
.brand small {
  font: 500 11px/1 var(--mono); color: var(--ember);
  letter-spacing: 1.4px; text-transform: uppercase;
  padding: 4px 8px; border-radius: 999px;
  background: rgba(255, 123, 57, 0.12);
  border: 1px solid rgba(255, 123, 57, 0.35);
}
.topactions {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.pillbtn {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(20, 18, 16, 0.85);
  color: var(--ink-2);
  border: 1px solid var(--line-2);
  border-radius: 999px;
  padding: 7px 14px;
  font: 500 12.5px/1 var(--sans);
  cursor: pointer;
  backdrop-filter: blur(8px);
  transition: all 0.18s ease;
  text-decoration: none;
}
.pillbtn:hover {
  color: var(--ink); border-color: var(--ember);
  background: rgba(30, 26, 22, 0.95);
}
.pillbtn.active {
  background: rgba(255, 123, 57, 0.18);
  color: var(--ember);
  border-color: var(--ember);
}
.pillbtn.cta {
  background: var(--ember); color: var(--ember-ink);
  border-color: var(--ember); font-weight: 600;
}
.pillbtn.cta:hover { filter: brightness(1.08); }

/* Bottom HUD (Chapters + Timeline + Transport) */
.bottomhud {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding: 10px 24px 16px;
  background: linear-gradient(0deg, rgba(7,6,5,0.95) 0%, rgba(7,6,5,0.72) 68%, transparent 100%);
  transition: opacity 0.35s ease;
}
.hudinner {
  max-width: 1520px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 8px;
}
.chapters {
  display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px;
}
.chapbtn {
  position: relative;
  text-align: left;
  padding: 7px 10px 9px;
  border-radius: 8px;
  background: rgba(20, 18, 16, 0.78);
  border: 1px solid var(--line);
  color: var(--ink-2);
  cursor: pointer;
  overflow: hidden;
  transition: border-color 0.2s, background 0.2s, color 0.2s;
}
.chapbtn:hover {
  border-color: var(--line-2); color: var(--ink);
  background: rgba(30, 27, 24, 0.9);
}
.chapbtn.active {
  border-color: var(--ember); color: var(--ink);
  background: rgba(255, 123, 57, 0.11);
}
.chapbtn .cnum {
  display: block; font: 600 10px/1.2 var(--mono);
  color: var(--ember); letter-spacing: 0.8px; text-transform: uppercase;
}
.chapbtn .ctitle {
  display: block; font: 500 12px/1.25 var(--sans);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-top: 2px;
}
.chapbtn .cbar {
  position: absolute; left: 0; bottom: 0; height: 2.5px;
  background: var(--ember); width: 0%;
}
.transportbar {
  display: flex; align-items: center; gap: 12px;
}
.playtoggle {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-width: 118px; height: 36px; padding: 0 16px;
  border-radius: 999px; border: 0;
  background: var(--ember); color: var(--ember-ink);
  font: 600 13.5px/1 var(--sans); cursor: pointer;
}
.playtoggle:hover { filter: brightness(1.08); }
.stepbtn {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--surface-2); border: 1px solid var(--line-2);
  color: var(--ink); font-size: 16px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.stepbtn:hover { border-color: var(--ember); color: var(--ember); }
.scrubwrap {
  flex: 1; display: flex; align-items: center; gap: 10px;
}
.scrub {
  flex: 1; -webkit-appearance: none; appearance: none;
  height: 6px; border-radius: 3px;
  background: var(--line); outline: none; cursor: pointer;
}
.scrub::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px;
  border-radius: 50%; background: var(--ember);
  border: 2px solid var(--ink); cursor: pointer;
}
.timereadout {
  font: 500 12.5px/1 var(--mono); color: var(--ink-2);
  min-width: 95px; text-align: right;
}
.kbdhint {
  font: 11.5px/1 var(--mono); color: var(--ink-3);
  display: flex; gap: 12px; align-items: center;
}
.kbdhint kbd {
  background: var(--surface-2); border: 1px solid var(--line-2);
  border-radius: 4px; padding: 2px 5px; color: var(--ink-2);
  font: 10.5px/1 var(--mono);
}

/* Speaker Notes Card (toggleable with N) */
.notescard {
  position: fixed; right: 24px; top: 68px; z-index: 35;
  width: min(400px, calc(100vw - 48px));
  background: rgba(19, 17, 15, 0.94);
  border: 1px solid var(--ember);
  border-radius: 14px;
  padding: 14px 16px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.85);
  backdrop-filter: blur(10px);
}
.notescard[hidden] { display: none !important; }
.noteshead {
  display: flex; justify-content: space-between; align-items: center;
  font: 600 11px/1 var(--mono); color: var(--ember);
  letter-spacing: 1.1px; text-transform: uppercase;
  margin-bottom: 8px;
}
.noteshead button {
  background: none; border: 0; color: var(--ink-2);
  font-size: 17px; cursor: pointer;
}
.notesbody {
  font-size: 13.5px; line-height: 1.5; color: var(--ink);
}
.notesbody ul {
  padding-left: 16px; margin-top: 6px; display: grid; gap: 5px;
}
.notesbody li::marker { color: var(--ember); }

/* Finale CTA Overlay */
.finalecta {
  position: fixed; left: 50%; top: 75%; transform: translate(-50%, -50%);
  z-index: 25; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.finalecta[hidden] { display: none !important; }
.finalecta a, .finalecta button {
  padding: 13px 26px; border-radius: 999px;
  font: 600 15px/1 var(--sans); text-decoration: none;
  cursor: pointer; transition: transform 0.15s ease, filter 0.15s ease;
  box-shadow: 0 12px 32px rgba(0,0,0,0.7);
}
.finalecta a:hover, .finalecta button:hover {
  transform: translateY(-2px); filter: brightness(1.08);
}
.finalecta .primary {
  background: var(--ember); color: var(--ember-ink); border: 0;
}
.finalecta .secondary {
  background: rgba(20, 18, 16, 0.92); color: var(--ink);
  border: 1.5px solid var(--ember);
}
.finalecta .ghostbtn {
  background: rgba(20, 18, 16, 0.85); color: var(--ink-2);
  border: 1px solid var(--line-2);
}

@media (max-width: 960px) {
  .chapters { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .kbdhint { display: none; }
}
</style>
</head>

<div class="finalecta" id="finalecta" hidden>
  <a class="primary" id="ctaTour" href="index.html?tour&lang=tr">🧭 İki Dakikalık Rehberli Turu Başlat</a>
  <a class="secondary" id="ctaExplore" href="index.html?lang=tr">🔭 Gökyüzünü Serbestçe Keşfet</a>

<footer class="bottomhud" id="bottomhud">

    <div class="chapters" id="chapters"></div>

      <button type="button" class="stepbtn" id="prevscene" title="Önceki Sahne (Sol Ok)">‹</button>

        <input type="range" class="scrub" id="scrub" min="0" max="132" step="0.05" value="0" aria-label="Zaman çizelgesi">

  </div>
</footer>

// Decode real SPHEREx stamps into offscreen canvases for instant hardware-accelerated blitting
const STAMP_CACHE = {};
function decodeStampCanvas(b64, size, tintMode = 'gray') {
  const key = b64.slice(0, 24) + '_' + tintMode;
  if (STAMP_CACHE[key]) return STAMP_CACHE[key];
  const bin = atob(b64);
  const cv = document.createElement('canvas');
  cv.width = size; cv.height = size;
  const c = cv.getContext('2d');
  const im = c.createImageData(size, size);
  const d = im.data;
  for (let i = 0; i < size * size; i++) {
    const v = bin.charCodeAt(i);
    const o = i * 4;
    if (tintMode === 'ir') {
      // Warm infrared thermal palette
      d[o] = Math.min(255, Math.round(v * 1.15));
      d[o + 1] = Math.min(255, Math.round(Math.pow(v / 255, 1.35) * 235));
      d[o + 2] = Math.min(255, Math.round(Math.pow(v / 255, 2.2) * 190));
      d[o + 3] = 255;
    } else {
      d[o] = v; d[o + 1] = v; d[o + 2] = v; d[o + 3] = 255;
    }
  }
  c.putImageData(im, 0, 0);
  STAMP_CACHE[key] = cv;
  return cv;
}

function makeTimeColorCanvas(b64Early, b64Mid, b64Late, size) {
  const key = 'rgb_' + b64Early.slice(0, 16) + b64Late.slice(0, 16);
  if (STAMP_CACHE[key]) return STAMP_CACHE[key];
  const b1 = atob(b64Early), b2 = atob(b64Mid), b3 = atob(b64Late);
  const cv = document.createElement('canvas');
  cv.width = size; cv.height = size;
  const c = cv.getContext('2d');
  const im = c.createImageData(size, size);
  const d = im.data;
  for (let i = 0; i < size * size; i++) {
    const r = b1.charCodeAt(i), g = b2.charCodeAt(i), b = b3.charCodeAt(i);
    const o = i * 4;
    d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = 255;
  }
  c.putImageData(im, 0, 0);
  STAMP_CACHE[key] = cv;
  return cv;
}

  const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453;

  const s3 = Math.sin(i * 91.7 + 3.1) * 8123.4;
  return {
    x: (s - Math.floor(s)) * 1920,
    y: (s2 - Math.floor(s2)) * 1080,
    r: 0.6 + (s3 - Math.floor(s3)) * 1.8,
    a: 0.2 + ((i * 7) % 10) * 0.07,

});

let audioCtx = null;
let droneGain = null;
let lastPingKey = '';

function initAudio() {
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();
  droneGain = audioCtx.createGain();
  droneGain.gain.value = 0.0001;
  droneGain.connect(audioCtx.destination);

  // Warm cosmic chord (D2, A2, F#3)
  [73.42, 110.0, 146.83, 220.0].forEach((freq, idx) => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
    osc.frequency.value = freq;
    g.gain.value = idx < 2 ? 0.035 : 0.012;
    osc.connect(g);
    g.connect(droneGain);
    osc.start();
  });
}

function playTelemetryPing(freq = 520, dur = 0.14, vol = 0.035) {
  if (!audioEnabled || !audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.15, now + dur);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  } catch (e) {}
}

function toggleAudio() {
  initAudio();
  if (!audioCtx) return;
  audioEnabled = !audioEnabled;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  droneGain.gain.setTargetAtTime(audioEnabled ? 0.45 : 0.0001, now, 0.3);
  updateUI();
  if (audioEnabled) playTelemetryPing(660, 0.18, 0.04);
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t) { return a + (b - a) * clamp(t, 0, 1); }
function easeOutCubic(t) { const x = clamp(t, 0, 1); return 1 - Math.pow(1 - x, 3); }
function easeInOutCubic(t) {
  const x = clamp(t, 0, 1);
  return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawCard(x, y, w, h, opts = {}) {
  ctx.save();
  roundRect(ctx, x, y, w, h, opts.r || 16);
  ctx.fillStyle = opts.fill || 'rgba(18, 15, 13, 0.88)';
  ctx.fill();
  ctx.lineWidth = opts.bw || 1.2;
  ctx.strokeStyle = opts.border || '#2f2a25';
  ctx.stroke();
  if (opts.accentTop) {
    ctx.save();
    ctx.clip();
    ctx.fillStyle = opts.accentTop;
    ctx.fillRect(x, y, w, 3.5);
    ctx.restore();
  }
  ctx.restore();
}

function drawBadge(x, y, text, color = '#ff7b39', bg = 'rgba(255,123,57,0.14)') {
  ctx.save();
  ctx.font = '600 12px "IBM Plex Mono", monospace';
  const tw = ctx.measureText(text).width;
  const pw = tw + 20, ph = 25;
  roundRect(ctx, x, y, pw, ph, 12.5);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + 10, y + ph / 2 + 0.5);
  ctx.restore();
  return pw;
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight, align = 'left') {
  const words = text.split(' ');
  let line = '';
  const lines = [];
  for (let n = 0; n < words.length; n++) {
    const testLine = line + words[n] + ' ';
    if (ctx.measureText(testLine).width > maxWidth && n > 0) {
      lines.push(line.trim());
      line = words[n] + ' ';
    } else {
      line = testLine;
    }
  }
  if (line.trim()) lines.push(line.trim());
  ctx.save();
  ctx.textAlign = align;
  lines.forEach((l, i) => {
    ctx.fillText(l, x, y + i * lineHeight);
  });
  ctx.restore();
  return lines.length * lineHeight;
}

function wavelengthToColor(lam) {
  // 0.75 to 5.0 um -> warm infrared spectrum
  const t = clamp((lam - 0.75) / (5.0 - 0.75), 0, 1);
  if (t < 0.25) {
    const u = t / 0.25;
    return `rgb(${Math.round(lerp(130, 255, u))}, ${Math.round(lerp(195, 232, u))}, ${Math.round(lerp(255, 175, u))})`;
  } else if (t < 0.55) {
    const u = (t - 0.25) / 0.30;
    return `rgb(255, ${Math.round(lerp(232, 135, u))}, ${Math.round(lerp(175, 57, u))})`;
  } else if (t < 0.80) {
    const u = (t - 0.55) / 0.25;
    return `rgb(${Math.round(lerp(255, 215, u))}, ${Math.round(lerp(135, 48, u))}, ${Math.round(lerp(57, 30, u))})`;
  } else {
    const u = (t - 0.80) / 0.20;
    return `rgb(${Math.round(lerp(215, 145, u))}, ${Math.round(lerp(48, 20, u))}, ${Math.round(lerp(30, 24, u))})`;
  }
}

  lvGrad.addColorStop(0.82, '#d62828');

  ctx.font = '600 12px "IBM Plex Mono", monospace';

  const ticks = [['0.75 µm', 0.02], ['1.4 µm (H₂O)', 0.24], ['2.4 µm', 0.48], ['3.3 µm (CH₄)', 0.72], ['5.0 µm', 0.95]];
  ticks.forEach(([lbl, pos]) => {
    ctx.fillText(lbl, fx + fw * pos - 20, fy - 10);
  });

  // 8 animated exposures stepping across the filter!
  const stepCycle = (localT * 1.15) % 9;
  const activeStep = Math.min(7, Math.floor(stepCycle));
  const samplePoints = [
    { lam: 0.92, flux: 0.72 },
    { lam: 1.41, flux: 0.28, dip: 'H₂O' },
    { lam: 1.72, flux: 0.84 },
    { lam: 1.92, flux: 0.35, dip: 'H₂O' },
    { lam: 2.25, flux: 0.88 },

  const plotX = lam => sx + 40 + ((lam - 0.75) / (4.6 - 0.75)) * (sw - 80);

  [[1.32, 1.50, 'H₂O (Su)'], [1.82, 2.02, 'H₂O'], [2.58, 2.86, 'H₂O'], [3.18, 3.48, 'CH₄ (Metan)']].forEach(([l0, l1, name]) => {

  for (let i = 0; i <= activeStep; i++) {

  ctx.strokeStyle = 'rgba(255, 123, 57, 0.75)';
  ctx.lineWidth = 2.5;

  // Draw stars on the filter & laser beams dropping into the spectrum plot!
  for (let i = 0; i <= activeStep; i++) {

    const cyPlot = plotY(pt.flux);
    const isCurrent = i === activeStep;

    // Star position on the LVF filter
    ctx.beginPath();
    ctx.arc(cx, cyFilter, isCurrent ? 11 : 7, 0, Math.PI * 2);
    ctx.fillStyle = '#0a0908';
    ctx.fill();
    ctx.lineWidth = isCurrent ? 3 : 2;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();

    // Vertical laser beam from filter down to spectrum point
    ctx.beginPath();
    ctx.moveTo(cx, fy + fh);
    ctx.lineTo(cx, cyPlot);
    ctx.strokeStyle = isCurrent ? '#5fe0b0' : 'rgba(255, 255, 255, 0.22)';

    ctx.beginPath();
    ctx.arc(cx, cyPlot, isCurrent ? 8 : 5.5, 0, Math.PI * 2);
    ctx.fillStyle = wavelengthToColor(pt.lam);
    ctx.fill();
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = '#fff';
    ctx.stroke();
    ctx.textAlign = 'left';
  }

  // Bottom insight box on Right Card
  drawCard(fx, sy + sh + 16, fw, 74, { fill: 'rgba(95, 224, 176, 0.08)', border: 'rgba(95, 224, 176, 0.45)', r: 12 });

    fx + 18, sy + sh + 58
  );
  ctx.restore();
}

    ctx.ellipse(cx, cy + yOff, rxRing, rxRing * 0.22, 0, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.09)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  for (let lon = 0; lon < 6; lon++) {
    const a = rot + (lon * Math.PI) / 6;
    ctx.beginPath();
    ctx.ellipse(cx, cy, Math.abs(Math.cos(a)) * rad, rad, 0, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 123, 57, 0.14)';
    ctx.lineWidth = 1;

  // Simulated SPHEREx scanning swath band sweeping across the 3D sphere

  const swGrad = ctx.createLinearGradient(0, -36, 0, 36);
  swGrad.addColorStop(0, 'rgba(255, 123, 57, 0)');
  swGrad.addColorStop(0.5, 'rgba(255, 123, 57, 0.38)');

  ctx.fillStyle = swGrad;
  ctx.fillRect(-rad, -36, rad * 2, 72);

  // Dense galaxy/star points lighting up on sphere

    const u = (i / 140) * 2 - 1;
    const rProj = Math.sqrt(1 - u * u);
    const x3 = rProj * Math.cos(phi);
    const z3 = rProj * Math.sin(phi);
    if (z3 > -0.2) {
      const px = x3 * rad * 0.92;
      const py = u * rad * 0.92;
      const inSwath = Math.abs(py) < 32;
      ctx.beginPath();
      ctx.arc(px, py, inSwath ? 2.4 : 1.5, 0, Math.PI * 2);
      ctx.fillStyle = inSwath ? '#5fe0b0' : (i % 3 === 0 ? '#ff7b39' : '#e0d8c8');
      ctx.fill();
    }
  }
  ctx.restore();
  ctx.restore();

  // Telemetry Counters on right half of Left Card
  const countProg = easeOutCubic(Math.min(1, localT / 2.2));

  metrics.forEach((m, i) => {

    ctx.fillStyle = m.c;
    ctx.fillText(lang === 'tr' ? m.val : m.val_en, mx + 18, my + 44);

  // Bottom citizen science note on Left Card
  drawCard(lx + 28, ly + 575, lw - 56, 84, { fill: 'rgba(255, 123, 57, 0.09)', border: 'rgba(255, 123, 57, 0.4)', r: 12 });
  ctx.font = '500 15px "IBM Plex Sans", sans-serif';

  wrapText(
    ctx,
    lang === 'tr'

      : 'Volunteers spotted most of SOHO’s 5,000+ comets and 3,000 brown dwarf candidates in WISE. The more eyes that look, the more we find!',
    lx + 46, ly + 608, lw - 92, 22

  // RIGHT CARD: The 3 Technical Walls Blocking Ordinary Users

  ctx.font = '400 30px "Instrument Serif", Georgia, serif';

  const barriers = [

      desc_en: 'Viewing 360 exposures of one spot requires 360 × 63 MB = 22.6 GB of raw FITS files — impossible on a phone or normal browser.',
      c: '#ff5d8f',
      drawVisual: (vx, vy, vw, vh) => {

        ctx.font = '700 18px "IBM Plex Mono", monospace';
        ctx.fillStyle = '#ff5d8f';
        ctx.fillText('63 MB', vx + 42, vy + 55);

        ctx.fillStyle = '#e0d6c8';

        ctx.fillText('= 22.6 GB!', vx + 38, vy + 98);

    },
    {

      title_tr: 'Dönük Açılar (TAN-SIP) ve Gökyüzü Parıltısı',

      drawVisual: (vx, vy, vw, vh) => {

          ctx.rotate(a + Math.sin(localT + idx) * 0.08);

  barriers.forEach((b, i) => {

      c: '#5fe0b0'

  stages.forEach((st, i) => {

    const isAct = i === activeStage;

    drawCard(cx, cy, cardW, cardH, {
      accentTop: st.c,
      border: isAct ? st.c : (isPast ? '#483f36' : '#2a2520'),
      bw: isAct ? 2.2 : 1.2,
      fill: isAct ? 'rgba(26, 22, 19, 0.95)' : 'rgba(18, 15, 13, 0.86)'

    drawBadge(cx + 22, cy + 22, lang === 'tr' ? st.step : st.step_en, st.c);
    ctx.font = '400 26px "Instrument Serif", Georgia, serif';
    ctx.fillStyle = '#f3eee6';
    ctx.fillText(lang === 'tr' ? st.title_tr : st.title_en, cx + 22, cy + 78);

    // Visual Diagram Box inside each stage card
    const vx = cx + 22, vy = cy + 98, vw = cardW - 44, vh = 275;
    drawCard(vx, vy, vw, vh, { fill: '#080706', border: '#2f2a25', r: 12 });

    ctx.save();
    roundRect(ctx, vx, vy, vw, vh, 12);
    ctx.clip();

    if (i === 0) {
      // Stage 1 Visual: Sky Index + 2000 -> 2026 Proper Motion & Parallax Ellipse
      ctx.strokeStyle = 'rgba(76, 201, 240, 0.14)';

        ctx.beginPath(); ctx.moveTo(vx + gx, vy); ctx.lineTo(vx + gx, vy + vh); ctx.stroke();
      }
      for (let gy = 40; gy < vh; gy += 45) {
        ctx.beginPath(); ctx.moveTo(vx, vy + gy); ctx.lineTo(vx + vw, vy + gy); ctx.stroke();
      }
      const p = (localT * 0.55) % 1;
      const x0 = vx + 85, y0 = vy + 210;

      ctx.beginPath(); ctx.arc(x0, y0, 9, 0, Math.PI * 2);
      ctx.strokeStyle = '#877e72'; ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);
      ctx.font = '600 11px "IBM Plex Mono", monospace';
      ctx.fillStyle = '#877e72'; ctx.fillText('J2000.0', x0 - 22, y0 + 24);

      // Helical parallax + proper motion path

        if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);

      const curX = lerp(x0, x1, p) + Math.sin(p * Math.PI * 6) * 8;
      const curY = lerp(y0, y1, p) + Math.cos(p * Math.PI * 6) * 8;
      ctx.beginPath(); ctx.arc(curX, curY, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#5fe0b0'; ctx.fill();
      ctx.fillStyle = '#5fe0b0'; ctx.fillText('2026.8 (Bugün)', x1 - 45, y1 - 16);
      ctx.fillStyle = '#b8afa2';
      ctx.fillText(lang === 'tr' ? 'Öz Hareket + Paralaks Salınımı' : 'Proper Motion + Parallax Wobble', vx + 18, vy + 28);

      ctx.strokeStyle = '#ff7b39'; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.arc(dstX + dstS / 2, dstY + dstS / 2, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#fff'; ctx.fill();
      ctx.beginPath(); ctx.arc(dstX + dstS / 2, dstY + dstS / 2, 18, 0, Math.PI * 2);
      ctx.strokeStyle = '#5fe0b0'; ctx.stroke();

      ctx.font = '700 15px "IBM Plex Mono", monospace';
      ctx.fillStyle = '#5fe0b0';
      ctx.fillText('~200 KB!', dstX + 16, dstY + dstS + 24);
      ctx.font = '500 11.5px "IBM Plex Mono", monospace';
      ctx.fillStyle = '#ff7b39';
      ctx.fillText(lang === 'tr' ? '%99.7 Daha Az Veri' : '99.7% Less Data', dstX + 4, dstY + dstS + 44);
    } else if (i === 2) {
      // Stage 3 Visual: Tilted exposures rotating into North-Up alignment
      const alignT = 0.5 - 0.5 * Math.cos(localT * 1.4); // 0 -> tilted, 1 -> aligned!
      const mcx = vx + vw / 2, mcy = vy + vh / 2 + 8;

        const curA = a0 * (1 - alignT);
        ctx.save();
        ctx.translate(mcx, mcy);
        ctx.rotate(curA);
        ctx.strokeStyle = alignT > 0.85 ? '#5fe0b0' : '#f2c14e';
        ctx.globalAlpha = 0.35 + idx * 0.15;
        ctx.lineWidth = 1.8;
        ctx.strokeRect(-68, -68, 136, 136);
        // Star pair inside frame
        ctx.beginPath(); ctx.arc(0, -12, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = '#fff'; ctx.fill();
        ctx.beginPath(); ctx.arc(28, 22, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#f2c14e'; ctx.fill();
        ctx.restore();
      });
      ctx.font = '600 12px "IBM Plex Mono", monospace';
      ctx.fillStyle = alignT > 0.85 ? '#5fe0b0' : '#f2c14e';

        alignT > 0.85

      feats.forEach((ft, idx) => {
        drawCard(bx, by + 125 + idx * 40, vw - 40, 34, { fill: 'rgba(95, 224, 176, 0.1)', border: 'rgba(95, 224, 176, 0.35)', r: 8 });

        ctx.fillText(ft, bx + 12, by + 147 + idx * 40);

    ctx.restore();

    // Description text under visual box

  ctx.arc(wcx, wcy, 24, 0, Math.PI * 2);
  ctx.strokeStyle = isVisibleNow ? '#ff7b39' : '#877e72';
  ctx.lineWidth = isVisibleNow ? 2.8 : 1.8;

      fill: act ? (dObj.det >= 5 ? 'rgba(255, 123, 57, 0.24)' : 'rgba(255,255,255,0.12)') : 'rgba(20, 18, 16, 0.8)',

      dObj.det >= 5
        ? (lang === 'tr' ? '● Parlak Kızılötesi Nokta!' : '● Bright IR Detection!')

  ctx.font = '400 14px "IBM Plex Sans", sans-serif';
  ctx.fillStyle = '#e0d8c8';
  wrapText(
    ctx,
    lang === 'tr'

  // --------------------------------------------------------------------------

  // --------------------------------------------------------------------------
  const x3 = x2 + colW + gap;
  drawCard(x3, y0, colW, colH, {
    accentTop: '#4cc9f0',
    border: focusCol === 2 ? '#4cc9f0' : '#352f29',
    bw: focusCol === 2 ? 2.4 : 1.2
  });
  drawBadge(x3 + 24, y0 + 20, lang === 'tr' ? 'KANIT 3 · MOLEKÜL İZLERİ VE PARLAMA' : 'PROOF 3 · MOLECULE BANDS & VARIABILITY', '#4cc9f0', 'rgba(76,201,240,0.14)');
  ctx.font = '400 28px "Instrument Serif", Georgia, serif';
  ctx.fillStyle = '#f3eee6';
  ctx.fillText(lang === 'tr' ? 'Su, Metan ve Değişen Genç Yıldızlar' : 'Water, Methane & Flaring Newborn Stars', x3 + 24, y0 + 74);

  // TOP PLOT IN COL 3: Epsilon Indi B Real 450-point Spectrum
  const sp1X = x3 + 24, sp1Y = y0 + 96, sp1W = colW - 48, sp1H = 270;

  const mapLamX = lam => sp1X + 36 + ((lam - 0.75) / (4.95 - 0.75)) * (sp1W - 56);
  // Log scale for Epsilon Indi B flux (0.3 to 35 mJy)
  const mapFluxY1 = fl => {
    const lf = Math.log10( clamp(fl, 0.25, 35) );
    const u = (lf - Math.log10(0.25)) / (Math.log10(35) - Math.log10(0.25));
    return sp1Y + sp1H - 28 - u * (sp1H - 64);
  };

  // Shaded absorption bands on Epsilon Indi B plot
  const absBands = [
    [1.34, 1.48, 'H₂O'],
    [1.80, 1.98, 'H₂O'],
    [2.55, 2.85, 'H₂O'],
    [3.15, 3.50, 'CH₄']
  ];
  absBands.forEach(([b0, b1, mol]) => {
    const bx0 = mapLamX(b0), bx1 = mapLamX(b1);
    ctx.fillStyle = mol === 'CH₄' ? 'rgba(255, 123, 57, 0.14)' : 'rgba(76, 201, 240, 0.12)';
    ctx.fillRect(bx0, sp1Y + 32, bx1 - bx0, sp1H - 58);
    ctx.font = '600 10.5px "IBM Plex Mono", monospace';
    ctx.fillStyle = mol === 'CH₄' ? '#ff7b39' : '#4cc9f0';
    ctx.fillText(mol, bx0 + 3, sp1Y + 46);
  });

  // Progressive reveal of real Epsilon Indi B spectrum points
  const ePts = REAL_DATA.epsindib.pts;
  const maxLamReveal = 0.75 + 4.3 * ((localT * 0.22) % 1);
  const epColors = ['#4cc9f0', '#ff5d8f', '#ffd166', '#5fe0b0'];
  for (let i = 0; i < ePts.length; i++) {
    const [lam, fl, ep] = ePts[i];
    const px = mapLamX(lam), py = mapFluxY1(fl);
    const active = lam <= maxLamReveal;
    ctx.beginPath();
    ctx.arc(px, py, active ? 2.4 : 1.6, 0, Math.PI * 2);
    ctx.fillStyle = active ? epColors[ep % epColors.length] : 'rgba(255,255,255,0.15)';
    ctx.fill();
  }

  ctx.font = '400 11.5px "IBM Plex Sans", sans-serif';
  ctx.fillStyle = '#b8afa2';

  ctx.font = '600 12px "IBM Plex Mono", monospace';
  ctx.fillStyle = '#ff5d8f';
  ctx.fillText(lang === 'tr' ? 'RW AURIGAE · 1 YIL İÇİNDE DEĞİŞEN BEBEK YILDIZ TAYFI' : 'RW AURIGAE · NEWBORN STAR CHANGING WITHIN 1 YEAR', sp2X + 14, sp2Y + 22);

  // Legend for Visit 1 vs Visit 2
  ctx.fillStyle = '#4cc9f0'; ctx.fillText(lang === 'tr' ? '● Ziyaret 1 (Eyl 2025)' : '● Visit 1 (Sep 2025)', sp2X + 14, sp2Y + 42);
  ctx.fillStyle = '#ff5d8f'; ctx.fillText(lang === 'tr' ? '● Ziyaret 2 (Mar 2026)' : '● Visit 2 (Mar 2026)', sp2X + 190, sp2Y + 42);

  const mapFluxY2 = fl => {
    const lf = Math.log10(clamp(fl, 80, 1400));
    const u = (lf - Math.log10(80)) / (Math.log10(1400) - Math.log10(80));
    return sp2Y + sp2H - 36 - u * (sp2H - 88);
  };

  const rwPts = REAL_DATA.rwaur.pts;
  for (let i = 0; i < rwPts.length; i++) {
    const [lam, fl, ep] = rwPts[i];
    const px = mapLamX(lam), py = mapFluxY2(fl);
    ctx.beginPath();
    ctx.arc(px, py, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = ep === 0 ? '#4cc9f0' : '#ff5d8f';
    ctx.fill();
  }

  // Callout annotations on RW Aurigae plot
  drawBadge(sp2X + 42, sp2Y + 62, lang === 'tr' ? '<1.6 µm: +%40 Parlaklaştı!' : '<1.6 µm: +40% Brighter!', '#ff5d8f', 'rgba(255,93,143,0.16)');
  drawBadge(sp2X + sp2W - 235, sp2Y + 185, lang === 'tr' ? '>3.8 µm: -%50 Sönükleşti!' : '>3.8 µm: -50% Faded!', '#4cc9f0', 'rgba(76,201,240,0.16)');

  ctx.font = '400 11.5px "IBM Plex Sans", sans-serif';
  ctx.fillStyle = '#b8afa2';
  ctx.fillText(
    lang === 'tr'
      ? 'Çevredeki komşu yıldızlar %1–2 içinde sabit kalırken, RW Aurigae bir yılda çarpıcı biçimde değişti.'
      : 'While neighbour stars stayed flat within 1–2%, RW Aurigae changed dramatically within a year.',
    sp2X + 14, sp2Y + sp2H - 10
  );
}

// ============================================================================
// MASTER RENDER FRAME (1920x1080 VIRTUAL CANVAS)
// ============================================================================
function getCurrentScene(t) {
  for (let i = SCENES.length - 1; i >= 0; i--) {
    if (t >= SCENES[i].t0) return SCENES[i];
  }
  return SCENES[0];
}

function getActiveSubtitle(scene, t) {
  const list = lang === 'tr' ? scene.subs_tr : scene.subs_en;
  for (const [s0, s1, txt] of list) {
    if (t >= s0 && t <= s1) return txt;
  }
  return list[list.length - 1][2];
}

function renderFrame(t) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = window.innerWidth, H = window.innerHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
  }

  ctx.save();
  ctx.scale(dpr, dpr);

  // Fill background
  ctx.fillStyle = '#070605';
  ctx.fillRect(0, 0, W, H);

  // Compute uniform 16:9 cinema scaling centered in viewport
  const scale = Math.min(W / 1920, H / 1080);
  const offX = (W - 1920 * scale) / 2;
  const offY = (H - 1080 * scale) / 2;

  ctx.translate(offX, offY);
  ctx.scale(scale, scale);

  // Subtle drifting starfield across entire 1920x1080 stage
  BG_STARS.forEach(s => {
    const sx = (s.x + t * (s.warm ? 4.5 : 1.8)) % 1920;
    const twinkle = 0.65 + 0.35 * Math.sin(t * 2.2 + s.x);
    ctx.beginPath();
    ctx.arc(sx, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = s.warm
      ? `rgba(255, 165, 95, ${(s.a * twinkle).toFixed(3)})`
      : `rgba(243, 238, 230, ${(s.a * twinkle).toFixed(3)})`;
    ctx.fill();
  });

  const scene = getCurrentScene(t);
  const localT = Math.max(0, t - scene.t0);

  // Render active scene
  if (scene.id === 1) renderScene1(localT);
  else if (scene.id === 2) renderScene2(localT);
  else if (scene.id === 3) renderScene3(localT);
  else if (scene.id === 4) renderScene4(localT);
  else if (scene.id === 5) renderScene5(localT);
  else if (scene.id === 6) renderScene6(localT);
  else renderScene7(localT);

  // Voiceover Subtitle Bar (y: 868..942)
  const subText = getActiveSubtitle(scene, t);
  if (subText) {
    ctx.save();
    roundRect(ctx, 180, 868, 1560, 68, 34);
    ctx.fillStyle = 'rgba(12, 10, 9, 0.92)';
    ctx.fill();
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = 'rgba(255, 123, 57, 0.45)';
    ctx.stroke();

    ctx.font = '500 20px "IBM Plex Sans", sans-serif';
    ctx.fillStyle = '#f3eee6';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(subText, 960, 903);
    ctx.restore();
  }

  ctx.restore();
}

function buildChapterButtons() {
  chaptersEl.innerHTML = '';
  SCENES.forEach((sc, idx) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chapbtn';
    btn.innerHTML = `
      <span class="cnum">${lang === 'tr' ? 'SAHNE' : 'ACT'} 0${sc.id}</span>
      <span class="ctitle">${lang === 'tr' ? sc.short_tr : sc.short_en}</span>

    btn.addEventListener('click', () => {
      jumpToScene(idx);
    });
    chaptersEl.appendChild(btn);
  });

function fmtSec(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec < 10 ? '0' : ''}${sec}`;
}

function updateUI() {
  const sc = getCurrentScene(currentTime);
  const chapBtns = chaptersEl.querySelectorAll('.chapbtn');
  chapBtns.forEach((b, idx) => {
    const sObj = SCENES[idx];
    b.classList.toggle('active', sObj.id === sc.id);
    const bar = b.querySelector('.cbar');
    if (bar) {
      let pct = 0;
      if (currentTime >= sObj.t1) pct = 100;
      else if (currentTime > sObj.t0) pct = ((currentTime - sObj.t0) / (sObj.t1 - sObj.t0)) * 100;
      bar.style.width = `${pct.toFixed(1)}%`;
    }
  });

  playBtn.textContent = playing
    ? (lang === 'tr' ? '⏸ Duraklat' : '⏸ Pause')
    : (lang === 'tr' ? '▶ Oynat' : '▶ Play');

  scrubEl.value = currentTime.toFixed(2);
  timeReadout.textContent = `${fmtSec(currentTime)} / ${fmtSec(TOTAL_DURATION)}`;

  modeBtn.classList.toggle('active', presenterMode);

  modeLabel.textContent = presenterMode

function jumpToScene(idx) {
  const clamped = clamp(idx, 0, SCENES.length - 1);

// Auto-hide HUD after 3.2s of mouse inactivity while playing
let idleTimer = null;
function wakeHUD() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  if (playing) {
    idleTimer = setTimeout(() => {
      if (playing && !notesOpen) document.body.classList.add('idle');
    }, 3200);
  }
}
window.addEventListener('mousemove', wakeHUD);
window.addEventListener('keydown', e => {
  wakeHUD();
  if (e.code === 'Space') {
    e.preventDefault();
    if (currentTime >= TOTAL_DURATION - 0.2) currentTime = 0;
    playing = !playing;
    updateUI();
  } else if (e.code === 'ArrowRight') {
    e.preventDefault();
    const sc = getCurrentScene(currentTime);
    jumpToScene(Math.min(SCENES.length - 1, sc.id));
  } else if (e.code === 'ArrowLeft') {
    e.preventDefault();
    const sc = getCurrentScene(currentTime);
    const idx = currentTime - sc.t0 > 2.5 ? sc.id - 1 : Math.max(0, sc.id - 2);
    jumpToScene(idx);
  } else if (e.key >= '1' && e.key <= '7') {
    jumpToScene(parseInt(e.key, 10) - 1);
  } else if (e.key === 'p' || e.key === 'P') {
    presenterMode = !presenterMode;
    updateUI();
  } else if (e.key === 'm' || e.key === 'M') {
    toggleAudio();
  } else if (e.key === 'n' || e.key === 'N') {
    notesOpen = !notesOpen;
    updateUI();
  } else if (e.key === 'l' || e.key === 'L') {
    lang = lang === 'tr' ? 'en' : 'tr';
    buildChapterButtons();
    updateUI();
  } else if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
});

// Deterministic frame hook for automated video rendering
window.__setCinemaTime = function(tSec, hideHud = true) {
  playing = false;
  currentTime = clamp(tSec, 0, TOTAL_DURATION);
  if (hideHud) document.body.classList.add('idle');
  finaleCta.hidden = true;
  renderFrame(currentTime);
};

// Main 60 FPS Animation Loop
function tick(now) {
  const dt = Math.min(0.1, (now - lastFrameWall) / 1000);
  lastFrameWall = now;

  if (playing) {
    const scBefore = getCurrentScene(currentTime);
    const nextT = currentTime + dt;
    if (presenterMode && nextT >= scBefore.t1 - 0.12) {
      // In Presenter Mode, loop seamlessly inside the active scene so visuals stay alive while speaker talks!
      currentTime = scBefore.t0 + 2.5;
    } else if (nextT >= TOTAL_DURATION) {
      currentTime = TOTAL_DURATION;
      playing = false;
      document.body.classList.remove('idle');
    } else {
      currentTime = nextT;
    }
    updateUI();
  }

  renderFrame(currentTime);
  requestAnimationFrame(tick);
}

buildChapterButtons();
updateUI();
wakeHUD();
requestAnimationFrame(tick);
</script>
