name: Refresh sky index
# Brings the index of every public SPHEREx exposure up to date with the NASA/IPAC archive,
# so new data releases appear on the site without any change to the code.
# Only what is new is downloaded. If the archive cannot be reached, or the result does not
# add up, the job fails and the published index is left as it is.
on:
  schedule:
    - cron: "17 3 * * 1"      # every Monday
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: index
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/build_index.py
      - name: Commit the new index
        run: |
          git config user.name "Muhammet Mücahit Soylu"
          git config user.email "88398387+muhammetmucahitsoylu@users.noreply.github.com"
          git add web/index
          git diff --cached --quiet || git commit -m "Refresh sky index"
          git push
