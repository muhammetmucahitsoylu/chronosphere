name: Refresh sky index
# Rebuilds the index of every public SPHEREx exposure from the NASA/IPAC archive,
# so new data releases appear on the site without any change to the code.
on:
  schedule:
    - cron: "17 3 * * 1"      # every Monday
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/build_index.py
      - name: Commit the new index
        run: |
          git config user.name "Muhammet Mücahit Soylu"
          git config user.email "88398387+muhammetmucahitsoylu@users.noreply.github.com"
          git add web/index
          git diff --cached --quiet || git commit -m "Refresh sky index"
          git push
